<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0}body{width:1600px;height:1000px;overflow:hidden;position:relative;font-family:system-ui,sans-serif}img{display:block;width:100%}.pg{position:absolute;border-radius:12px;overflow:hidden;background:#fff}.pg .tb{height:22px;background:#f3f4f6;display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid rgba(0,0,0,.06)}.pg .tb i{width:7px;height:7px;border-radius:50%;background:#d4d6db}.lap{position:absolute;left:120px;top:250px;width:860px;transform:perspective(2200px) rotateY(22deg) rotateX(6deg);transform-origin:left center}
.lid{background:#1c1c1e;border-radius:22px 22px 0 0;padding:16px 16px 20px;box-shadow:0 0 0 2px #3a3a3c inset}
.lid .scr{border-radius:5px;overflow:hidden}
.base{height:22px;margin:0 -50px;background:linear-gradient(#e3e3e6,#a9a9ae);border-radius:0 0 20px 20px;box-shadow:0 60px 60px -30px rgba(40,60,20,.45)}
.floor{position:absolute;left:150px;top:810px;width:900px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,60,20,.25),transparent)}body{background:radial-gradient(800px 600px at 30% 40%,rgba(255,255,255,.55),transparent 70%),#dfe4d6}.pg img{height:calc(100% - 22px);object-fit:cover;object-position:top}</style></head><body><div class="floor"></div><div class="lap"><div class="lid"><div class="scr"><img src="z-hero.png"></div></div><div class="base"></div></div><div class="pg" style="right:330px;top:90px;width:340px;height:500px;transform:perspective(1600px) rotateY(-14deg) rotateZ(2deg);z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.06),0 30px 60px -20px rgba(0,0,0,.30)"><div class="tb"><i></i><i></i><i></i></div><img src="z2.png"></div><div class="pg" style="right:90px;top:300px;width:340px;height:500px;transform:perspective(1600px) rotateY(-14deg) rotateZ(-3deg);z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.06),0 30px 60px -20px rgba(0,0,0,.30)"><div class="tb"><i></i><i></i><i></i></div><img src="z1.png"></div></body></html>
