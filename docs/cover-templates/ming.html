<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;overflow:hidden;position:relative;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;
 background:radial-gradient(900px 650px at 50% 10%,rgba(240,170,160,.45),transparent 70%),radial-gradient(700px 500px at 5% 100%,rgba(250,215,180,.7),transparent 70%),linear-gradient(160deg,#fbf2e8 0%,#f6e3d6 100%)}
.ph{position:absolute;width:440px;border-radius:76px;padding:12px;
 background:linear-gradient(145deg,#f4f4f6 0%,#b9bbc1 18%,#e9eaed 40%,#9fa2a8 70%,#d9dadd 100%);
 box-shadow:0 70px 120px -40px rgba(120,40,30,.5),0 30px 50px -30px rgba(120,40,30,.35)}
.in{border-radius:66px;background:#0b0b0c;padding:10px}
.scr{position:relative;border-radius:56px;overflow:hidden;background:#e32228}
.scr img{display:block;width:100%}
.status{height:74px;background:#e32228;display:flex;align-items:flex-start;justify-content:space-between;padding:28px 44px 0;color:#fff;font-weight:600;font-size:25px}
.isl{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:150px;height:46px;border-radius:24px;background:#000;z-index:2}
.bat{width:38px;height:19px;border:2.5px solid #fff;border-radius:6px;position:relative}.bat:after{content:"";position:absolute;inset:3px;right:7px;background:#fff;border-radius:3px}
.btn{position:absolute;width:7px;border-radius:4px;background:linear-gradient(90deg,#9fa2a8,#e3e4e7)}
</style></head><body>
<!-- Ming Burger digital menu: three phones fanned out, warm cream background tinted with Ming red.
     c1 = lunch specials, c2 = "معاك كام؟" budget picker, c3 = burgers (390×844 captures at 2×). -->
<div class="ph" style="left:150px;top:150px;transform:rotate(-11deg)">
 <span class="btn" style="left:-5px;top:200px;height:76px"></span>
 <div class="in"><div class="scr"><div class="isl"></div><div class="status"><span>9:41</span><span class="bat"></span></div><img src="c3.png"></div></div></div>
<div class="ph" style="left:1010px;top:150px;transform:rotate(11deg)">
 <span class="btn" style="left:-5px;top:200px;height:76px"></span>
 <div class="in"><div class="scr"><div class="isl"></div><div class="status"><span>9:41</span><span class="bat"></span></div><img src="c2.png"></div></div></div>
<div class="ph" style="left:580px;top:70px">
 <span class="btn" style="left:-5px;top:200px;height:76px"></span>
 <div class="in"><div class="scr"><div class="isl"></div><div class="status"><span>9:41</span><span class="bat"></span></div><img src="c1.png"></div></div></div>
</body></html>
