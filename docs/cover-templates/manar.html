<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;overflow:hidden;position:relative;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;
 background:radial-gradient(900px 650px at 75% 15%,rgba(175,186,240,.55),transparent 70%),radial-gradient(800px 600px at 10% 95%,rgba(205,212,245,.7),transparent 70%),linear-gradient(160deg,#eef0fa 0%,#e2e5f5 100%)}
.ph{position:absolute;width:560px;border-radius:92px;padding:14px;
 background:linear-gradient(145deg,#f4f4f6 0%,#b9bbc1 18%,#e9eaed 40%,#9fa2a8 70%,#d9dadd 100%);
 box-shadow:0 70px 120px -40px rgba(40,45,100,.55),0 30px 50px -30px rgba(40,45,100,.35)}
.in{border-radius:80px;background:#0b0b0c;padding:12px}
.scr{position:relative;border-radius:68px;overflow:hidden;background:#121212}
.scr img{display:block;width:100%}
.status{height:92px;background:#121212;display:flex;align-items:flex-start;justify-content:space-between;padding:34px 54px 0;color:#fff;font-weight:600;font-size:30px}
.isl{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:190px;height:56px;border-radius:30px;background:#000;z-index:2}
.isl:after{content:"";position:absolute;right:30px;top:20px;width:16px;height:16px;border-radius:50%;background:#1b1f3a}
.icons{display:flex;gap:10px;align-items:center}
.bat{width:44px;height:22px;border:2.5px solid #fff;border-radius:7px;position:relative}.bat:after{content:"";position:absolute;inset:3px;right:8px;background:#fff;border-radius:3px}
.btn{position:absolute;width:8px;border-radius:4px;background:linear-gradient(90deg,#9fa2a8,#e3e4e7)}
</style></head><body>
<div class="ph" style="left:180px;top:150px;transform:rotate(-14deg)">
 <span class="btn" style="left:-6px;top:240px;height:90px"></span><span class="btn" style="left:-6px;top:350px;height:90px"></span>
 <div class="in"><div class="scr"><div class="isl"></div><div class="status"><span>9:41</span><span class="icons"><span class="bat"></span></span></div><img src="mn1.png"></div></div></div>
<div class="ph" style="left:820px;top:40px;transform:rotate(-14deg)">
 <span class="btn" style="left:-6px;top:240px;height:90px"></span><span class="btn" style="left:-6px;top:350px;height:90px"></span>
 <div class="in"><div class="scr"><div class="isl"></div><div class="status"><span>9:41</span><span class="icons"><span class="bat"></span></span></div><img src="mn2.png"></div></div></div>
</body></html>
