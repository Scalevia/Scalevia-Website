<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0}body{width:1600px;height:1000px;overflow:hidden;position:relative;font-family:system-ui,sans-serif}img{display:block;width:100%}.pg{position:absolute;border-radius:12px;overflow:hidden;background:#fff}.pg .tb{height:22px;background:#f3f4f6;display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid rgba(0,0,0,.06)}.pg .tb i{width:7px;height:7px;border-radius:50%;background:#d4d6db}.imac{position:absolute;right:120px;top:120px;width:880px}
.mon{background:linear-gradient(#e9eaec,#cfd1d5);border-radius:22px;padding:16px 16px 0;box-shadow:0 50px 80px -30px rgba(80,30,30,.45)}
.mon .scr{border-radius:6px;overflow:hidden;background:#000;border:10px solid #111;border-bottom-width:12px}
.chin{height:70px;background:linear-gradient(#e4e5e8,#c9cbcf);border-radius:0 0 22px 22px;margin:0 -16px;position:relative}
.neck{width:170px;height:120px;margin:0 auto;background:linear-gradient(90deg,#b9bbc0,#e3e4e7 50%,#b9bbc0);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.foot{width:300px;height:14px;margin:0 auto;border-radius:6px 6px 10px 10px;background:linear-gradient(#e4e5e8,#b5b7bc);box-shadow:0 26px 40px -10px rgba(80,30,30,.45)}body{background:radial-gradient(900px 600px at 70% 30%,rgba(255,255,255,.6),transparent 70%),#ecdcd8}.pg img{height:calc(100% - 22px);object-fit:cover;object-position:top}</style></head><body><div class="pg" style="left:100px;top:300px;width:270px;height:388px;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.06),0 30px 60px -20px rgba(0,0,0,.30)"><div class="tb"><i></i><i></i><i></i></div><img src="h1.png"></div><div class="pg" style="left:300px;top:150px;width:270px;height:520px;z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.06),0 30px 60px -20px rgba(0,0,0,.30)"><div class="tb"><i></i><i></i><i></i></div><img src="h2.png"></div><div class="imac" style="z-index:3"><div class="mon"><div class="scr"><img src="h-hero.png"></div><div class="chin"></div></div><div class="neck"></div><div class="foot"></div></div></body></html>
